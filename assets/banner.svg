<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1620"/>
      <stop offset="100%" stop-color="#131b2a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="45%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#21262d" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- 光晕 -->
  <circle cx="960" cy="80" r="240" fill="url(#glowBlue)" filter="url(#blur)"/>
  <circle cx="1080" cy="320" r="200" fill="url(#glowPurple)" filter="url(#blur)"/>

  <!-- Agent 节点网络（右侧） -->
  <g>
    <!-- 中心大节点 -->
    <circle cx="880" cy="190" r="46" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
    <circle cx="880" cy="190" r="52" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="48;60;48" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="880" y="197" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#58a6ff" text-anchor="middle">AGENT</text>

    <!-- 环绕节点 -->
    <g fill="#bc8cff">
      <circle cx="720" cy="120" r="10"/>
      <circle cx="1020" cy="100" r="10"/>
      <circle cx="1060" cy="250" r="10"/>
      <circle cx="740" cy="280" r="10"/>
      <circle cx="1000" cy="320" r="8"/>
      <circle cx="650" cy="200" r="8"/>
    </g>
    <!-- 连线 -->
    <g stroke="#30363d" stroke-width="1.5">
      <line x1="834" y1="170" x2="730" y2="125"/>
      <line x1="926" y1="170" x2="1010" y2="105"/>
      <line x1="926" y1="210" x2="1050" y2="245"/>
      <line x1="834" y1="210" x2="745" y2="275"/>
      <line x1="880" y1="236" x2="995" y2="315"/>
      <line x1="880" y1="236" x2="658" y2="205"/>
    </g>
    <!-- 连线脉冲 -->
    <circle r="3" fill="#58a6ff">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M880,190 L730,125"/>
    </circle>
    <circle r="3" fill="#bc8cff">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M880,190 L1050,245"/>
    </circle>

    <!-- 悬浮标签 -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8b949e">
      <text x="720" y="105">MCP</text>
      <text x="1040" y="92">ROS2</text>
      <text x="1070" y="272">Gazebo</text>
      <text x="720" y="305">Safety</text>
    </g>
  </g>

  <!-- 标题区 -->
  <text x="80" y="165" font-family="'Courier New',monospace" font-size="96" font-weight="bold" fill="url(#title)">TMXJ</text>
  <rect x="448" y="105" width="5" height="74" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="82" y="225" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e6edf3">天漠雪佳 · 用 AI Agent 造东西的工程师</text>
  <text x="82" y="265" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8b949e">AI Agent × 智能制造 × 具身智能 — 从山东荣成的一台电脑开始</text>

  <!-- 底部代码行装饰 -->
  <g font-family="'Courier New',monospace" font-size="14" fill="#3fb950" opacity="0.85">
    <text x="80" y="330">$</text>
    <text x="102" y="330" fill="#8b949e">agent build</text>
    <text x="200" y="330" fill="#58a6ff">--target</text>
    <text x="292" y="330" fill="#e6edf3">smart-factory</text>
    <text x="440" y="330" fill="#3fb950">✓</text>
    <text x="470" y="330" fill="#8b949e">compiled</text>
    <text x="566" y="330" fill="#8b949e">322 tests passed</text>
  </g>
  <rect x="80" y="345" width="700" height="1.5" fill="#21262d"/>
  <rect x="80" y="348" width="180" height="2" fill="#58a6ff" opacity="0.6">
    <animate attributeName="width" values="60;180;60" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
