<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#10161f"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- 光晕 -->
  <circle cx="860" cy="50" r="200" fill="url(#glow1)"/>
  <circle cx="120" cy="260" r="160" fill="url(#glow2)"/>

  <!-- 节点网络（Agent 主题：节点 = Agent，连线 = 编排） -->
  <g stroke="#21262d" stroke-width="1.2" fill="#58a6ff">
    <line x1="70" y1="230" x2="190" y2="185"/>
    <line x1="190" y1="185" x2="320" y2="215"/>
    <line x1="70" y1="230" x2="130" y2="272"/>
    <line x1="130" y1="272" x2="320" y2="215"/>
    <line x1="190" y1="185" x2="170" y2="120"/>
    <line x1="320" y1="215" x2="250" y2="150"/>
    <line x1="170" y1="120" x2="250" y2="150"/>
    <line x1="130" y1="272" x2="60" y2="275"/>
    <circle cx="70" cy="230" r="4.5"/>
    <circle cx="190" cy="185" r="4.5"/>
    <circle cx="320" cy="215" r="4.5"/>
    <circle cx="130" cy="272" r="3.5"/>
    <circle cx="170" cy="120" r="3.5"/>
    <circle cx="250" cy="150" r="3.5"/>
    <circle cx="60" cy="275" r="3"/>
  </g>

  <!-- 扫描线 -->
  <g stroke="#1f6feb" stroke-width="0.5" opacity="0.18">
    <line x1="700" y1="240" x2="960" y2="240"/>
    <line x1="720" y1="255" x2="980" y2="255"/>
    <line x1="690" y1="270" x2="940" y2="270"/>
  </g>

  <!-- 主文字 -->
  <text x="62" y="135" font-family="'Courier New',monospace" font-size="72" font-weight="bold" fill="url(#txt)">TMXJ</text>
  <text x="64" y="175" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#e6edf3">天漠雪佳 · 用 AI Agent 造东西的工程师</text>
  <text x="64" y="208" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8b949e">Agent × 智能制造 × 具身智能 —— 从山东荣成的一台电脑开始</text>

  <!-- 终端光标 -->
  <rect x="318" y="97" width="5" height="56" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
