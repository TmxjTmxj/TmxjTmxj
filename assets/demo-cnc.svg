<svg xmlns="http://www.w3.org/2000/svg" width="380" height="260" viewBox="0 0 380 260" role="img" aria-label="cnc-cam-gcode-simulator 演示">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a30"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="380" height="260" rx="16" fill="url(#card)" stroke="#2a3a5e" stroke-width="1.5"/>
  <circle cx="340" cy="60" r="70" fill="#a855f7" opacity="0.06" filter="url(#glow)"/>

  <!-- header -->
  <text x="20" y="34" font-size="15" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-weight="700" fill="#e6edf3">⚙️ cnc-cam-gcode</text>
  <rect x="300" y="18" width="64" height="22" rx="11" fill="#1f2540" stroke="#60a5fa" stroke-width="1"/>
  <text x="332" y="33" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#7dd3fc" text-anchor="middle">DEMO</text>

  <!-- part outline -->
  <rect x="40" y="70" width="150" height="90" rx="6" fill="#0b1226" stroke="#2a3a5e" stroke-width="1.5"/>
  <path d="M190,70 L230,110 L190,160 L40,160" fill="none" stroke="#2a3a5e" stroke-width="1.5"/>

  <!-- toolpath being drawn -->
  <path d="M40,160 L40,70 L150,70 L150,100 L110,160 M150,100 L230,110" fill="none" stroke="url(#bar)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" values="360;0" dur="4s" repeatCount="indefinite"/>
  </path>
  <!-- cutter -->
  <circle r="6" fill="#22d3ee">
    <animateMotion dur="4s" repeatCount="indefinite" path="M40,160 L40,70 L150,70 L150,100 L110,160 M150,100 L230,110"/>
  </circle>

  <!-- G-code line -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="11">
    <text x="40" y="212" fill="#8b98ac">G0 X40 Y160</text>
    <text x="40" y="228" fill="#60a5fa">G1 X200 Y120 F240</text>
    <text x="150" y="228" fill="#3fb950">✓</text>
  </g>
  <text x="20" y="246" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8b98ac">DXF → CAM → 2D/3D 仿真 · 44 tests</text>
</svg>
