    </circle>
    <text x="230" y="78" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#f0abfc">峰值 0.18N</text>
  </g>

  <text x="20" y="246" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8b98ac">Abaqus/Explicit · MCP 自动化 · 发明专利</text>
</svg>
