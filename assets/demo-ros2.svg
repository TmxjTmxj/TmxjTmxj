<svg xmlns="http://www.w3.org/2000/svg" width="380" height="260" viewBox="0 0 380 260" role="img" aria-label="ros2-agent-workflow 演示">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a30"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="380" height="260" rx="16" fill="url(#card)" stroke="#2a3a5e" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="70" fill="#22d3ee" opacity="0.06" filter="url(#glow)"/>

  <!-- header -->
  <text x="20" y="34" font-size="15" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-weight="700" fill="#e6edf3">🤖 ros2-agent-workflow</text>
  <rect x="300" y="18" width="64" height="22" rx="11" fill="#1f2540" stroke="#60a5fa" stroke-width="1"/>
  <text x="332" y="33" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#7dd3fc" text-anchor="middle">DEMO</text>

  <!-- floor grid -->
  <g stroke="#1b2740" stroke-width="1">
    <line x1="20" y1="88" x2="360" y2="88"/>
    <line x1="20" y1="112" x2="360" y2="112"/>
    <line x1="20" y1="160" x2="360" y2="160"/>
  </g>
  <!-- ground -->
  <line x1="20" y1="196" x2="360" y2="196" stroke="#2a3a5e" stroke-width="2"/>

  <!-- start point -->
  <circle cx="44" cy="196" r="5" fill="#f0abfc"/>
  <text x="44" y="222" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="10" fill="#8b98ac" text-anchor="middle">START</text>

  <!-- goal -->
  <g>
    <line x1="330" y1="196" x2="330" y2="150" stroke="#3fb950" stroke-width="2"/>
    <path d="M330,150 L348,158 L330,166 Z" fill="#3fb950"/>
    <circle cx="330" cy="196" r="12" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="8;22" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="330" y="232" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="10" fill="#8b98ac" text-anchor="middle">GOAL</text>

  <!-- robot moving -->
  <g>
    <g>
      <rect x="-14" y="-24" width="28" height="24" rx="4" fill="#0b1226" stroke="url(#bar)" stroke-width="1.8"/>
      <circle cx="-6" cy="-14" r="3" fill="#22d3ee"/>
      <circle cx="6" cy="-14" r="3" fill="#a855f7"/>
      <circle cx="0" cy="-8" r="2.5" fill="#3fb950"/>
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M44,196 L330,196"/>
    </g>
  </g>

  <!-- MCP status blink -->
  <text x="48" y="150" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#22d3ee">
    MCP: navigate() 
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="164" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#3fb950">✓ reached</text>
</svg>
