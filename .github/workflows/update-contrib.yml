name: Update contribution heatmap

# Regenerates assets/contrib-heatmap.svg from the real GitHub contribution
# calendar. It runs only when you push to this repo or when you manually
# trigger it from the Actions tab — no scheduled/background runs, and it uses
# only the free auto-issued GITHUB_TOKEN (never a personal access token).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-contrib.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/contrib-heatmap.svg; then
            echo "No change to heatmap"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg
          git commit -m "chore: update contribution heatmap"
          git push
